name: MARBL CI
on: [push, pull_request]
jobs:
  MARBL-Testing:
    runs-on: ubuntu-latest

    strategy:
        matrix:
            python-version:
                - 3.9

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup python environment
        run: |
          pip install pyyaml numpy xarray netcdf4
          pip install -r docs/py_requirements.txt
      - name: Load Environment
        run: |
          sudo apt-get update
          sudo apt install make gfortran netcdf-bin libnetcdf-dev libnetcdff-dev openmpi-bin libopenmpi-dev
      - name: Run Test Suite
        run: |
          cd MARBL_tools
          ./run_test_suite.sh
      - name: Build docs
        run: |
          cd docs/src
          make html

  CMake-Build:
    runs-on: ubuntu-latest

    strategy:
        matrix:
            use-mpi:
                - 'OFF'
                - 'ON'

    steps:
      - uses: actions/checkout@v4

      - name: Load Environment
        run: |
          sudo apt-get update
          sudo apt install make gfortran pkg-config libnetcdff-dev openmpi-bin libopenmpi-dev
      - name: Build library and driver
        run: |
          cmake --version
          cmake -S . -B build -DMARBL_USE_MPI=${{ matrix.use-mpi }} -DMARBL_DRIVER_NETCDF=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build --parallel
      - name: Run driver
        run: |
          cd tests/regression_tests/call_compute_subroutines
          settings=../../input_files/settings/marbl_with_o2_consumption_scalef.settings
          if [ "${{ matrix.use-mpi }}" == "ON" ]; then
            mpirun -n 2 ../../../build/driver_exe/marbl-mpi.exe -n test.nml -u cgs -s $settings
          else
            ../../../build/driver_exe/marbl.exe -n test.nml -u cgs -s $settings
          fi
          test -s history_1inst.nc
      - name: Install library
        run: |
          cmake --install build --prefix ${{ runner.temp }}/marbl
      - name: Build against the installed library
        run: |
          mkdir ${{ runner.temp }}/consumer && cd ${{ runner.temp }}/consumer
          printf 'program consumer\n  use marbl_interface, only : marbl_interface_class\n  type(marbl_interface_class) :: marbl_instance\nend program consumer\n' > consumer.F90
          printf 'cmake_minimum_required(VERSION 3.24)\nproject(consumer LANGUAGES Fortran)\nfind_package(MARBL REQUIRED)\nadd_executable(consumer consumer.F90)\ntarget_link_libraries(consumer PRIVATE MARBL::marbl)\n' > CMakeLists.txt
          cmake -S . -B build -DCMAKE_PREFIX_PATH=${{ runner.temp }}/marbl
          cmake --build build
